<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista de Tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Mi Lista de Tareas</h1>
            <p class="subtitle">Organiza tus actividades diarias</p>
        </header>

        <div class="input-section">
            <input
                type="text"
                id="taskInput"
                class="task-input"
                placeholder="Escribe una nueva tarea..."
                autocomplete="off"
            />
            <button id="addBtn" class="btn btn-add">Agregar Tarea</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="active">Activas</button>
            <button class="filter-btn" data-filter="completed">Completadas</button>
        </div>

        <div class="stats">
            <span id="totalTasks">Total: 0</span>
            <span id="completedTasks">Completadas: 0</span>
        </div>

        <ul id="taskList" class="task-list"></ul>

        <div class="empty-state" id="emptyState">
            <p>📭 No hay tareas. ¡Crea una nueva!</p>
        </div>

        <button id="clearBtn" class="btn btn-clear">Limpiar Completadas</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
